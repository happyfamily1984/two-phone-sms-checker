<!doctype html><html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@500;700;900&display=block" rel="stylesheet">
<style>
*{margin:0;box-sizing:border-box}
body{font-family:'Noto Sans KR',sans-serif;background:#000}
.shot{width:1080px;height:1920px;position:relative;overflow:hidden;
 background:linear-gradient(160deg,#4A55EE 0%,#7B6AF6 55%,#B394FA 100%);}
.shot:before{content:"";position:absolute;width:900px;height:900px;border-radius:50%;background:rgba(255,255,255,.08);left:-380px;top:-300px}
.shot:after{content:"";position:absolute;width:760px;height:760px;border-radius:50%;background:rgba(255,255,255,.07);right:-300px;bottom:120px}
.cap{position:absolute;top:110px;left:0;right:0;text-align:center;color:#fff;z-index:2}
.cap h1{font-size:76px;font-weight:900;letter-spacing:-2px;line-height:1.22}
.cap p{margin-top:26px;font-size:38px;font-weight:500;opacity:.92;letter-spacing:-.5px}
.phone{position:absolute;left:50%;top:500px;transform:translateX(-50%);width:744px;height:1653px;
 border-radius:76px;background:#16142B;padding:18px;box-shadow:0 40px 90px rgba(25,15,90,.45);z-index:2}
.phone img{width:100%;height:100%;border-radius:60px;object-fit:cover;object-position:top;display:block}
.feature{width:1024px;height:500px;position:relative;overflow:hidden;
 background:linear-gradient(120deg,#4A55EE 0%,#7B6AF6 60%,#A98AF9 100%);font-family:'Noto Sans KR'}
.feature .c1{position:absolute;width:520px;height:520px;border-radius:50%;background:rgba(255,255,255,.08);left:-200px;top:-220px}
.feature .c2{position:absolute;width:420px;height:420px;border-radius:50%;background:rgba(255,255,255,.08);right:-90px;bottom:-200px}
.feature .icon{position:absolute;left:70px;top:105px;width:290px;height:290px;border-radius:66px;box-shadow:0 24px 50px rgba(20,10,80,.4)}
.feature .t{position:absolute;left:410px;top:120px;color:#fff}
.feature h1{font-size:74px;font-weight:900;letter-spacing:-2px}
.feature p{font-size:33px;font-weight:500;margin-top:16px;line-height:1.45;opacity:.95}
</style></head><body>
<div id="root"></div>
<script>
const shots=[
 ["1_receiver","다른 폰에 온 문자,<br>여기서 바로 확인","문자·카카오톡 알림을 실시간으로 받아요"],
 ["3_sender","폰이 몇 대든<br>하나로 연결","투폰·쓰리폰 모두 연결 코드 하나로"],
 ["5_code","내용은 암호화되어<br>안전하게","연결 코드를 아는 내 폰만 볼 수 있어요"],
 ["7_select","받은 알림은<br>한곳에 모아서","길게 눌러 골라 지우기까지 간편하게"],
 ["4_chooser","설치하고 역할만<br>고르면 시작","보내는 폰 · 받는 폰 각각 여러 대 가능"],
];
const q=new URLSearchParams(location.search);
const r=document.getElementById('root');
if(q.get('f')){
 r.innerHTML=`<div class="feature"><div class="c1"></div><div class="c2"></div><img class="icon" src="screens/play_icon_512.png">
 <div class="t"><h1>투폰문자체커</h1><p>내 다른 폰에 온 문자·카톡 알림을<br>지금 들고 있는 폰에서 바로 확인</p></div></div>`;
}else{
 const s=shots[+q.get('i')];
 r.innerHTML=`<div class="shot"><div class="cap"><h1>${s[1]}</h1><p>${s[2]}</p></div><div class="phone"><img src="screens/${s[0]}.png"></div></div>`;
}
</script></body></html>
